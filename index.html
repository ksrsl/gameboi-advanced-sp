<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#11151b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22><rect width=%22100%25%22 height=%22100%25%22 rx=%2220%22 fill=%22%237d2232%22/><text x=%2250%25%22 y=%2268%25%22 text-anchor=%22middle%22 font-size=%2264%22 fill=%22white%22>K</text></svg>">
  <title>KSR Gameboi SP</title>
  <link rel="stylesheet" href="css/console.css?v=1.5.0">
  <link rel="stylesheet" href="games/snake/snake.css?v=1.5.0">
  <link rel="stylesheet" href="games/block-drop/block-drop.css?v=1.5.0">
  <link rel="stylesheet" href="games/brick-blaster/brick-blaster.css?v=1.5.0">
  <link rel="stylesheet" href="games/astro-defender/astro-defender.css?v=1.5.0">
  <link rel="stylesheet" href="games/pet-byte/pet-byte.css?v=1.5.0">
</head>
<body>
  <main id="console" aria-label="KSR Gameboi SP screen">
    <section id="display" aria-live="polite">
      <div id="boot" class="screen active">
        <div class="boot-logo"><span>K</span>SR</div>
        <div class="boot-bar"><i></i></div>
      </div>

      <div id="home" class="screen menu-screen" hidden>
        <header><span>KSR Gameboi SP</span></header>
        <div class="menu-copy">SELECT A MODE</div>
        <nav id="main-menu" class="pixel-menu" aria-label="Main menu">
          <button data-action="play" class="selected">PLAY GAME</button>
          <button data-action="scores">HIGH SCORES</button>
          <button data-action="settings">SETTINGS</button>
          <button data-action="about">ABOUT</button>
          <button data-action="power">TURN OFF</button>
        </nav>
        <footer><span>▲▼ MOVE</span><span>A SELECT</span></footer>
      </div>

      <div id="cartridges" class="screen menu-screen cartridge-screen" hidden>
        <header><span>CARTRIDGES</span></header>
        <div class="menu-copy">CHOOSE A GAME</div>
        <nav id="cartridge-menu" class="pixel-menu" aria-label="Cartridge menu">
          <button data-game="snake" class="selected"><b>SNAKE BYTE</b><small>ARCADE</small></button>
          <button data-game="block-drop"><b>BLOCK DROP</b><small>PUZZLE</small></button>
          <button data-game="brick-blaster"><b>BRICK BLASTER</b><small>ACTION</small></button>
          <button data-game="astro-defender"><b>ASTRO DEFENDER</b><small>SHOOTER</small></button>
          <button data-game="pet-byte"><b>PET BYTE</b><small>VIRTUAL PET</small></button>
        </nav>
        <footer><span>▲▼ MOVE</span><span>A LOAD • B BACK</span></footer>
      </div>

      <div id="panel" class="screen panel-screen" hidden>
        <header><button id="panel-back" aria-label="Back">‹</button><h1 id="panel-title"></h1></header>
        <div id="panel-content"></div>
      </div>

      <div id="loading" class="screen status-screen" hidden>
        <div class="spinner"></div><strong>READING CARTRIDGE</strong><small id="loading-name">PLEASE WAIT</small>
      </div>

      <div id="error" class="screen status-screen error-screen" hidden>
        <strong>CARTRIDGE ERROR</strong><p id="error-message">COULD NOT LOAD GAME</p><button id="error-back">BACK TO MENU</button>
      </div>

      <div id="power-off" class="screen power-off-screen" hidden aria-label="Console powered off">
        <button id="power-on" aria-label="Turn console on"><span>POWER</span></button>
      </div>

      <div id="game-host" class="screen" hidden></div>
      <div id="live-status" hidden>LIVE</div>
      <button id="mute" aria-label="Toggle sound" title="Toggle sound">♪</button>
    </section>
  </main>
  <script type="module" src="js/console.js?v=1.5.0"></script>
</body>
</html>
